        // --- Main App Component ---
        function App() {
            const [activeTab, setActiveTab] = useState('Home');
            const [selectedCategory, setSelectedCategory] = useState(null);
            const [activeLevel, setActiveLevel] = useState(null);
            
            // Progress & State
            const [unlockedLevels, setUnlockedLevels] = useState({});
            const [totalXP, setTotalXP] = useState(0);
            const [streak, setStreak] = useState(5);
            
            // Game Play State
            const [mainQueue, setMainQueue] = useState([]);
            const [retryQueue, setRetryQueue] = useState([]);
            const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
            const [isEvaluating, setIsEvaluating] = useState(false);
            const [feedback, setFeedback] = useState(null);
            const [combo, setCombo] = useState(0);
            const [xpEarned, setXpEarned] = useState(0);
            const [levelStatus, setLevelStatus] = useState('playing'); // playing, cleared
            
            const mapScrollRef = useRef(null);
            const activeNodeRef = useRef(null);

            // Scroll to the current active level when map is opened
            useEffect(() => {
                if (selectedCategory && !activeLevel) {
                    setTimeout(() => {
                        if (activeNodeRef.current) {
                            activeNodeRef.current.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }, 100);
                }
            }, [selectedCategory, activeLevel]);

            // Load progress from localStorage on mount
            useEffect(() => {
                try {
                    const savedUnlocked = localStorage.getItem('blobyt_unlocked');
                    const savedXP = localStorage.getItem('blobyt_xp');
                    
                    let parsedUnlocked = savedUnlocked ? JSON.parse(savedUnlocked) : {};
                    
                    // Ensure Level 1 of every category is unlocked by default
                    CATEGORIES_DATA.forEach(cat => {
                        if (!parsedUnlocked[cat.id]) {
                            parsedUnlocked[cat.id] = [1];
                        } else if (!parsedUnlocked[cat.id].includes(1)) {
                            parsedUnlocked[cat.id].push(1);
                        }
                    });
                    
                    setUnlockedLevels(parsedUnlocked);
                    if (savedXP) setTotalXP(parseInt(savedXP, 10));
                } catch (e) {
                    console.error("Could not load save data", e);
                }
            }, []);

            // Save progress
            useEffect(() => {
                try {
                    if (Object.keys(unlockedLevels).length > 0) {
                        localStorage.setItem('blobyt_unlocked', JSON.stringify(unlockedLevels));
                        localStorage.setItem('blobyt_xp', totalXP.toString());
                    }
                } catch (e) {
                    console.error("Could not save data", e);
                }
            }, [unlockedLevels, totalXP]);

            const startGame = (levelData) => {
                setMainQueue([...levelData.questions]);
                setRetryQueue([]);
                setCurrentQuestionIdx(0);
                setCombo(0);
                setXpEarned(0);
                setActiveLevel(levelData);
                setLevelStatus('playing');
                setIsEvaluating(false);
                setFeedback(null);
            };

            const handleAnswer = (optionIdx) => {
                if (isEvaluating) return;
                
                const isMainQueue = currentQuestionIdx < mainQueue.length;
                const currentQ = isMainQueue ? mainQueue[currentQuestionIdx] : retryQueue[currentQuestionIdx - mainQueue.length];
                
                const isCorrect = optionIdx === currentQ.correct;

                if (isCorrect) {
                    const newCombo = combo + 1;
                    setCombo(newCombo);
                    const earned = 20 + (newCombo >= 2 ? 10 : 0);
                    setXpEarned(prev => prev + earned);
                    
                    setFeedback({
                        type: 'correct',
                        text: newCombo >= 2 ? `🔥 Combo! +${earned} XP` : `✨ Great job! +${earned} XP`,
                        explanation: currentQ.explanation
                    });
                } else {
                    setCombo(0);
                    setFeedback({
                        type: 'incorrect',
                        text: 'Oops! เดี๋ยวเราจะมาทบทวนข้อนี้กันใหม่นะ 📝'
                    });
                    
                    setRetryQueue(prev => [...prev, { ...currentQ, id: Date.now() }]);
                }
                
                setIsEvaluating(true);
            };

            const nextQuestion = () => {
                setIsEvaluating(false);
                setFeedback(null);
                
                const nextIdx = currentQuestionIdx + 1;
                const totalQuestionsToAsk = mainQueue.length + retryQueue.length;
                
                if (nextIdx >= totalQuestionsToAsk) {
                    setTotalXP(prev => prev + xpEarned);
                    setLevelStatus('cleared');
                    
                    const currentCat = CATEGORIES_DATA.find(c => c.id === selectedCategory.id);
                    const currentLevelIndex = currentCat.levels.findIndex(l => l.id === activeLevel.id);
                    
                    if (currentLevelIndex < currentCat.levels.length - 1) {
                        const nextLevelId = currentCat.levels[currentLevelIndex + 1].id;
                        setUnlockedLevels(prev => {
                            const catUnlocked = prev[currentCat.id] || [];
                            if (!catUnlocked.includes(nextLevelId)) {
                                return { ...prev, [currentCat.id]: [...catUnlocked, nextLevelId] };
                            }
                            return prev;
                        });
                    }
                } else {
                    setCurrentQuestionIdx(nextIdx);
                }
            };

            const renderHome = () => (
                <div className="flex-1 overflow-y-auto p-4 pb-28 scroll-smooth">
                    <div className="flex justify-between items-center mb-6 pt-4">
                        <div className="flex items-center gap-3">
                            <div className="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-sm border-2 border-emerald-100 overflow-hidden text-2xl">
                                🐱
                            </div>
                            <div>
                                <div className="font-extrabold text-lg">Hi, Blob 👋</div>
                                <div className="text-xs text-emerald-700 flex items-center gap-1 font-medium">
                                    <IconSparkles size={12} /> Grammar Master
                                </div>
                            </div>
                        </div>
                        <div className="bg-white/80 backdrop-blur-sm px-3 py-1.5 rounded-full shadow-sm border border-orange-100 flex items-center gap-1">
                            <IconFlame size={16} className="text-orange-500" />
                            <span className="font-bold text-sm text-orange-700">{streak} Days</span>
                        </div>
                    </div>

                    <div className="mb-8">
                        <h1 className="text-3xl font-black text-[#4A3B32] leading-tight mb-2">
                            Your grammar<br/>adventure
                        </h1>
                        <p className="text-[#6D5D52] text-sm">Step by step to fluency. 🌱</p>
                    </div>

                    <div className="space-y-4">
                        {CATEGORIES_DATA.map((cat) => {
                            const unlockedCount = (unlockedLevels[cat.id] || []).length;
                            const progressPercent = Math.min(100, Math.round((unlockedCount / cat.levels.length) * 100));

                            return (
                                <button 
                                    key={cat.id}
                                    onClick={() => setSelectedCategory(cat)}
                                    className="w-full bg-[#FFFDF7] rounded-3xl p-4 shadow-sm border border-emerald-50 flex items-center gap-4 hover:shadow-md hover:scale-[1.02] transition-all text-left"
                                >
                                    <div className={`w-20 h-20 rounded-2xl ${cat.color} flex items-center justify-center text-4xl shadow-inner`}>
                                        {cat.icon}
                                    </div>
                                    <div className="flex-1 py-1">
                                        <h3 className="font-extrabold text-lg text-[#4A3B32]">{cat.title}</h3>
                                        <p className="text-xs text-[#6D5D52] mb-3 leading-relaxed">{cat.subtitle}</p>
                                        <div className="flex items-center gap-2">
                                            <div className="flex-1 bg-gray-100 rounded-full h-2.5 overflow-hidden">
                                                <div 
                                                    className="h-full rounded-full transition-all duration-1000 ease-out"
                                                    style={{ width: `${progressPercent}%`, backgroundColor: cat.accentColor }}
                                                ></div>
                                            </div>
                                            <span className="text-xs font-bold" style={{ color: cat.accentColor }}>
                                                {progressPercent}%
                                            </span>
                                        </div>
                                    </div>
                                    <div className="w-8 h-8 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600 border border-emerald-100">
                                        <IconChevronLeft className="rotate-180" size={18} strokeWidth={3} />
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                </div>
            );

            const renderLevelMap = () => {
                const cat = selectedCategory;
                const unlocked = unlockedLevels[cat.id] || [1];
                const reversedLevels = [...cat.levels].reverse();

                return (
                    <div className="flex flex-col h-full bg-gradient-to-b from-sky-200 via-sky-100 to-emerald-100 relative">
                        <div className="absolute top-0 w-full p-4 flex items-center justify-between z-50 bg-gradient-to-b from-sky-200 to-transparent pb-10 pointer-events-none">
                            <button 
                                onClick={() => setSelectedCategory(null)}
                                className="w-10 h-10 bg-[#FFFDF7] rounded-full flex items-center justify-center shadow-sm text-[#4A3B32] border border-gray-200/50 pointer-events-auto active:scale-95 transition-transform cursor-pointer"
                            >
                                <IconChevronLeft size={24} strokeWidth={2.5} />
                            </button>
                            <div className="text-center pointer-events-auto">
                                <h2 className="font-extrabold text-lg text-[#4A3B32] drop-shadow-sm">{cat.title}</h2>
                                <p className="text-xs font-bold text-sky-800 bg-white/50 px-2 py-0.5 rounded-full inline-block">
                                    {unlocked.length} / {cat.levels.length} lessons
                                </p>
                            </div>
                            <div className="w-10"></div>
                        </div>

                        <div ref={mapScrollRef} className="flex-1 overflow-y-auto pt-24 pb-36 px-4 relative flex flex-col scroll-smooth">
                            <div className="absolute inset-0 pointer-events-none flex justify-center h-full w-full">
                                <svg width="100%" height="100%" style={{ minHeight: `${cat.levels.length * 120}px` }}>
                                    <path 
                                        d={`M 150 50 ${reversedLevels.map((_, i) => `Q ${i % 2 === 0 ? 300 : 50} ${100 + i * 120} 150 ${150 + i * 120}`).join(' ')}`} 
                                        fill="none" stroke="#D1D5DB" strokeWidth="16" strokeLinecap="round" strokeLinejoin="round" className="opacity-50"
                                    />
                                    <path 
                                        d={`M 150 50 ${reversedLevels.map((_, i) => `Q ${i % 2 === 0 ? 300 : 50} ${100 + i * 120} 150 ${150 + i * 120}`).join(' ')}`} 
                                        fill="none" stroke="#FCD34D" strokeWidth="12" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="1 24"
                                    />
                                </svg>
                            </div>

                            <div className="relative z-10 flex flex-col gap-12 py-8 items-center" style={{ minHeight: 'max-content' }}>
                                {reversedLevels.map((lvl, index) => {
                                    const isUnlocked = unlocked.includes(lvl.id);
                                    const isCurrent = unlocked.includes(lvl.id) && (!unlocked.includes(lvl.id + 1) || lvl.id === cat.levels.length);
                                    const isLastNode = lvl.id === cat.levels.length;
                                    const isEven = index % 2 === 0;

                                    return (
                                        <div key={lvl.id} ref={isCurrent ? activeNodeRef : null} className={`flex w-full ${isEven ? 'justify-end pr-10' : 'justify-start pl-10'} relative`}>
                                            <button
                                                onClick={() => isUnlocked && startGame(lvl)}
                                                disabled={!isUnlocked}
                                                className="relative flex flex-col items-center"
                                            >
                                                {isCurrent && (
                                                    <div className="absolute -top-10 animate-bounce bg-yellow-300 text-yellow-900 text-xs font-black px-3 py-1 rounded-full border-2 border-yellow-400 shadow-sm z-20 whitespace-nowrap">
                                                        START
                                                    </div>
                                                )}
                                                
                                                <div className={`flex items-center justify-center shadow-lg transition-transform
                                                    ${isLastNode ? 'w-24 h-24 rounded-3xl' : 'w-20 h-20 rounded-[2rem]'}
                                                    ${!isUnlocked ? 'bg-gray-300 border-b-4 border-gray-400 opacity-90' : 
                                                        isCurrent ? 'bg-amber-300 border-b-4 border-amber-500 scale-110' : 
                                                        'bg-[#FFFDF7] border-b-4 border-gray-200'}
                                                `}>
                                                    {!isUnlocked ? (
                                                        <IconLock size={32} className="text-gray-500" />
                                                    ) : isLastNode ? (
                                                        <div className="text-4xl">👑</div>
                                                    ) : (
                                                        <div className="text-center">
                                                            <span className={`text-2xl font-black ${isCurrent ? 'text-amber-800' : 'text-[#4A3B32]'}`}>
                                                                {lvl.id}
                                                            </span>
                                                            {isUnlocked && !isCurrent && (
                                                                <div className="absolute -bottom-2 -right-2 w-7 h-7 bg-emerald-400 rounded-full flex items-center justify-center border-2 border-white shadow-sm">
                                                                    <IconCheck size={16} strokeWidth={4} className="text-white" />
                                                                </div>
                                                            )}
                                                        </div>
                                                    )}
                                                </div>
                                            </button>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            const renderGame = () => {
                if (levelStatus === 'cleared') {
                    return (
                        <div className="flex-1 flex flex-col items-center justify-center p-6 bg-gradient-to-b from-emerald-100 to-sky-50 text-center">
                            <div className="text-6xl mb-6 animate-bounce">🎉</div>
                            <div className="bg-[#FFFDF7] rounded-3xl p-8 w-full max-w-sm shadow-xl border border-emerald-50 mb-8 relative">
                                <h2 className="text-3xl font-black text-emerald-800 mb-2">Level Cleared!</h2>
                                <p className="text-[#6D5D52] mb-6 font-medium">You are a grammar expert!</p>
                                
                                <div className="flex justify-center gap-4 mb-6">
                                    <div className="bg-emerald-50 rounded-2xl p-4 flex-1 border border-emerald-100">
                                        <IconTarget className="mx-auto text-emerald-500 mb-2" size={28} />
                                        <div className="text-xs text-emerald-700 font-bold uppercase tracking-wider mb-1">Accuracy</div>
                                        <div className="text-xl font-black text-emerald-900">100%</div>
                                    </div>
                                    <div className="bg-amber-50 rounded-2xl p-4 flex-1 border border-amber-100">
                                        <IconSparkles className="mx-auto text-amber-500 mb-2" size={28} />
                                        <div className="text-xs text-amber-700 font-bold uppercase tracking-wider mb-1">Total XP</div>
                                        <div className="text-xl font-black text-amber-900">+{xpEarned}</div>
                                    </div>
                                </div>
                                
                                <button 
                                    onClick={() => setActiveLevel(null)}
                                    className="w-full py-4 bg-emerald-500 text-white rounded-2xl font-bold text-lg shadow-[0_4px_0_rgb(5,150,105)] active:shadow-none active:translate-y-1 transition-all"
                                >
                                    Continue
                                </button>
                            </div>
                        </div>
                    );
                }

                const correctCount = currentQuestionIdx - retryQueue.length;
                const progress = Math.min(100, Math.max(0, (correctCount / mainQueue.length) * 100));
                
                const isMainQueue = currentQuestionIdx < mainQueue.length;
                const currentQ = isMainQueue ? mainQueue[currentQuestionIdx] : retryQueue[currentQuestionIdx - mainQueue.length];

                return (
                    <div className="flex flex-col h-full bg-[#FFFDF7] p-4 pb-12 overflow-y-auto">
                        <div className="flex items-center gap-4 mb-8 pt-2">
                            <button onClick={() => setActiveLevel(null)} className="text-gray-400 hover:text-gray-600 transition-colors">
                                <IconX size={28} strokeWidth={2.5} />
                            </button>
                            <div className="flex-1 bg-gray-100 h-3 rounded-full overflow-hidden">
                                <div className="h-full bg-emerald-400 rounded-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                            </div>
                            <div className="flex items-center gap-1.5 bg-amber-100 px-3 py-1.5 rounded-full border border-amber-200 text-amber-800 font-bold text-sm">
                                <IconSparkles size={16} className="text-amber-500" />
                                {xpEarned}
                            </div>
                        </div>

                        <div className="mb-6 flex-1 flex flex-col">
                            {!isMainQueue && !isEvaluating && (
                                <div className="bg-orange-100 text-orange-800 text-xs font-bold px-3 py-1 rounded-full w-max mb-4 self-center animate-pulse">
                                    📝 Retry Queue
                                </div>
                            )}
                            
                            <h2 className="text-2xl font-black text-[#4A3B32] mb-8 leading-snug">
                                {currentQ.q.split('___').map((part, i, arr) => (
                                    <Fragment key={i}>
                                        {part}
                                        {i !== arr.length - 1 && (
                                            <span className="inline-block w-16 border-b-2 border-gray-300 mx-1 align-baseline"></span>
                                        )}
                                    </Fragment>
                                ))}
                            </h2>

                            <div className="space-y-3 mt-auto">
                                {currentQ.options.map((opt, idx) => {
                                    let btnClass = "w-full p-4 rounded-2xl border-2 text-left font-bold text-lg transition-all ";
                                    
                                    if (!isEvaluating) {
                                        btnClass += "border-gray-200 bg-white hover:border-emerald-200 hover:bg-emerald-50 text-[#4A3B32] shadow-sm";
                                    } else {
                                        if (idx === currentQ.correct) {
                                            btnClass += "border-emerald-400 bg-emerald-100 text-emerald-800 shadow-md";
                                        } else {
                                            btnClass += "border-gray-200 bg-gray-50 text-gray-400 opacity-60";
                                        }
                                    }

                                    return (
                                        <button key={idx} disabled={isEvaluating} onClick={() => handleAnswer(idx)} className={btnClass}>
                                            {opt}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        {isEvaluating && (
                            <div className="mt-auto animate-in fade-in slide-in-from-bottom-4 duration-300">
                                {feedback.type === 'correct' ? (
                                    <div className="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 mb-4 shadow-sm">
                                        <h4 className="text-emerald-800 font-extrabold text-sm mb-2 flex items-center gap-2">
                                            <IconSparkles size={16} className="text-emerald-600" />
                                            {feedback.text}
                                        </h4>
                                        <div className="text-xs text-[#4A3B32] leading-relaxed font-medium bg-white/90 p-3 rounded-xl border border-emerald-100">
                                            {feedback.explanation}
                                        </div>
                                    </div>
                                ) : (
                                    <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 mb-4 shadow-sm flex items-center gap-3">
                                        <div className="text-2xl">📝</div>
                                        <h4 className="text-amber-900 font-bold text-sm leading-relaxed">
                                            {feedback.text}
                                        </h4>
                                    </div>
                                )}

                                <button
                                    onClick={nextQuestion}
                                    className={`w-full py-4 rounded-2xl font-bold text-lg text-white transition-all
                                        ${feedback.type === 'correct' ? 'bg-emerald-500 shadow-[0_4px_0_rgb(5,150,105)]' : 'bg-amber-500 shadow-[0_4px_0_rgb(217,119,6)]'} 
                                        active:shadow-none active:translate-y-1`}
                                >
                                    Continue
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            const renderProfile = () => (
                <div className="flex-1 overflow-y-auto p-4 pb-28 bg-[#FFFDF7]">
                    <h2 className="text-2xl font-black text-[#4A3B32] mb-6 pt-4 text-center">My Profile</h2>
                    
                    <div className="flex flex-col items-center mb-8">
                        <div className="w-24 h-24 bg-sky-100 rounded-full flex items-center justify-center shadow-inner border-4 border-white mb-3 text-5xl">🐱</div>
                        <h3 className="font-extrabold text-xl text-[#4A3B32]">Blob</h3>
                        <p className="text-sm text-emerald-600 font-medium flex items-center gap-1 mt-1">Growing a little every day 🌱</p>
                    </div>

                    <div className="grid grid-cols-2 gap-4 mb-6">
                        <div className="bg-orange-50 rounded-3xl p-5 shadow-sm border border-orange-100 flex flex-col">
                            <IconFlame className="text-orange-500 mb-2" size={28} />
                            <div className="text-xs text-orange-800 font-bold mb-1">Streak Days</div>
                            <div className="text-2xl font-black text-[#4A3B32]">{streak} days</div>
                        </div>
                        <div className="bg-sky-50 rounded-3xl p-5 shadow-sm border border-sky-100 flex flex-col">
                            <IconTrophy className="text-sky-500 mb-2" size={28} />
                            <div className="text-xs text-sky-800 font-bold mb-1">Total XP</div>
                            <div className="text-2xl font-black text-[#4A3B32]">{totalXP}</div>
                        </div>
                    </div>

                    <div className="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                        <h4 className="font-extrabold text-[#4A3B32] mb-4 flex items-center gap-2">
                            <IconCalendar size={18} className="text-emerald-500" />
                            Activity Calendar
                        </h4>
                        <div className="grid grid-cols-7 gap-2 text-center text-xs font-bold text-gray-400 mb-2">
                            <div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div><div>S</div>
                        </div>
                        <div className="grid grid-cols-7 gap-2">
                            {Array.from({ length: 14 }).map((_, i) => (
                                <div key={i} className={`aspect-square rounded-xl flex items-center justify-center text-xs font-medium
                                    ${i < streak ? 'bg-emerald-100 text-emerald-700 border border-emerald-200' : 'bg-gray-50 text-gray-300'}`}>
                                    {i < streak ? '🐾' : (10 + i)}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="font-sans text-[#4A3B32] h-full w-full relative flex flex-col">
                    {activeLevel ? renderGame() : selectedCategory ? renderLevelMap() : activeTab === 'Home' ? renderHome() : renderProfile()}

                    {!activeLevel && !selectedCategory && (
                        <div className="absolute bottom-0 w-full bg-white/95 backdrop-blur-md border-t border-gray-200 pb-8 pt-4 px-12 sm:pb-6 flex justify-between items-center z-50">
                            <button 
                                onClick={() => setActiveTab('Home')}
                                className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'Home' ? 'text-emerald-500' : 'text-gray-400'}`}
                            >
                                <div className={`p-2 rounded-xl ${activeTab === 'Home' ? 'bg-emerald-50' : ''}`}>
                                    <IconBookOpen size={24} strokeWidth={activeTab === 'Home' ? 2.5 : 2} />
                                </div>
                                <span className="text-[10px] font-bold">Lessons</span>
                            </button>
                            
                            <button 
                                onClick={() => setActiveTab('Profile')}
                                className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'Profile' ? 'text-emerald-500' : 'text-gray-400'}`}
                            >
                                <div className={`p-2 rounded-xl ${activeTab === 'Profile' ? 'bg-emerald-50' : ''}`}>
                                    <div className="w-6 h-6 bg-gray-200 rounded-full overflow-hidden flex items-center justify-center text-xs">🐱</div>
                                </div>
                                <span className="text-[10px] font-bold">Profile</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
